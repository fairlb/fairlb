name: Bug report
description: Something behaves differently from what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through [SECURITY.md](../blob/main/SECURITY.md)
        instead — that channel is private.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `fairlb version`, or the image tag you are running.
    validations: {required: true}
  - type: input
    id: provider
    attributes:
      label: Which model provider
      description: >
        If the report involves a specific upstream, name it. Upstream behaviour
        varies more than it looks like it should, and this is the single field
        that most often explains a report.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Relevant lines, with the request id if you have one. Check for
        credentials before pasting.
      render: text
