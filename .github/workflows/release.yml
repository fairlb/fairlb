# Publishes the container image.
#
# # Why this file has to exist
#
# The first thing in the README is `docker run ghcr.io/fairlb/fairlb:latest`.
# Before this workflow existed, that command returned `manifest unknown`.
# Anything the documentation promises, something has to actually produce.
#
# # Triggers
#
#   * tag `v*`     -> `:vX.Y.Z` and `:latest`
#   * push to main -> `:edge` only (runnable if you want the newest code, and
#                     not mistakable for a release)
#   * manual       -> troubleshooting
#
# `latest` follows tags only. If it followed main, one accidental commit would
# become the next `docker pull` for everyone running `:latest`.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # GoReleaser publishes the release and uploads artifacts
  packages: write
  id-token: write   # keyless signing: the OIDC identity is the key
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is enough: the package and the repository live in the
          # same org, so no separate PAT is needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fairlb
          # latest is tag-only; see the note at the top of this file.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # arm64 is a common self-hosting shape (Raspberry Pi, Ampere, Docker
          # Desktop on Apple silicon). Publishing amd64 only makes `docker run`
          # fail there with `exec format error`, which gives no hint that the
          # architecture is the problem.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image nobody can trace back to a commit is an image nobody can
          # audit. Both of these are consumed by `docker buildx imagetools
          # inspect` and by admission policies.
          provenance: mode=max
          sbom: true

  # Binaries, for people who would rather not run Docker. Tags only: there is
  # no such thing as a nightly binary release here.
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser derives the changelog from history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
