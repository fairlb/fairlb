# DCO check: every non-merge commit in a pull request needs a `Signed-off-by:`
# trailer.
#
# # Why this is a script and not a GitHub App
#
# The check itself is ten lines of shell. Installing an App would mean asking the
# repository owner to authorize it and trusting an external service with read
# access to every pull request. Not a good trade at this size.
#
# # What it checks, and what it deliberately does not
#
# Checks: that each non-merge commit carries a `Signed-off-by:` trailer.
# Does not check: that the email in the trailer matches the committer.
#
# The second one is intentionally loose. Contributors routinely have a git
# config email that differs from their GitHub account email (multiple
# identities, noreply addresses); failing them for that produces confusion, not
# assurance. The point of the DCO is that the contributor *makes the statement*;
# traceability comes from git history itself.
#
# Merge commits are skipped: GitHub generates them, so the contributor never had
# a chance to sign them.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full base..head range is needed; a shallow clone is not enough.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --no-merges: merge commits are generated by GitHub and should not
          # require a signature.
          # while-read rather than mapfile: mapfile needs bash 4+, and this
          # logic should run as-is on a maintainer's machine to verify it
          # (macOS still ships bash 3.2).
          total=0
          missing=0
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            total=$((total + 1))
            if git show -s --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              continue
            fi
            printf '  x %s %s\n' "$(git show -s --format=%h "$c")" "$(git show -s --format=%s "$c")"
            missing=$((missing + 1))
          done <<EOF
          $(git rev-list --no-merges "$BASE".."$HEAD")
          EOF
          if [ "$total" -eq 0 ]; then
            echo "No non-merge commits in this pull request; nothing to check."
            exit 0
          fi
          # Always print the counts: "found no missing sign-offs" and "checked
          # nothing at all" have the same exit code, and only the numbers tell
          # them apart.
          echo "Checked ${total} commit(s), ${missing} missing Signed-off-by."
          [ "$missing" -eq 0 ] || {
            cat <<'HINT'

          To fix (sign off every commit on the branch):

              git rebase --signoff origin/main
              git push --force-with-lease

          Using `git commit -s` from now on adds the trailer automatically.
          What you are certifying: https://developercertificate.org/ — that you
          wrote the code, or that you have the right to contribute it.
          HINT
            exit 1
          }
