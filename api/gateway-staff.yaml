      properties:
        severity:
          type: string
          enum:
          - blocker
          - warning
        code:
          $ref: '#/components/schemas/PricingRiskCode'
        message:
          type: string
        resource_id:
          type: string
          format: uuid
      additionalProperties: false
    PricingRiskCode:
      type: string
      description: 'Risk codes. Blockers and warnings are two distinct classes and must
        not be conflated. A blocker means incomplete data or a broken

        configuration — a missing price, no default plan, a multiplier out of range
        — and acknowledging one would be accepting a bill that cannot be

        computed. A warning is a commercial decision — going below cost, a steep drop
        in the customer price, affecting several organizations, switching to

        free — and may proceed once acknowledged.

        '
      enum:
      - missing_paid_rate
      - paid_all_zero
      - unverified_price_source
      - missing_default_plan
      - multiplier_out_of_range
      - negative_margin
      - customer_price_drop
      - multi_tenant_impact
      - switch_to_free
      - unknown_procurement_cost
    PricingRiskReport:
      type: object
      required:
      - risks
      description: The list of risks that blocked a save, from which a caller decides
        whether to correct the data or acknowledge and retry.
      properties:
        risks:
          type: array
          items:
            $ref: '#/components/schemas/PricingRisk'
      additionalProperties: false
    Problem:
      type: object
      description: RFC 9457 problem+json, plus a stable machine-readable code
      required:
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: A stable error code
        request_id:
          type: string
    ReferencePriceImportInput:
      type: object
      description: 'One import run. Every field is optional, and the defaults are the
        cautious reading of

        "fill in the reference prices": only models with no price at all, across the
        whole catalogue,

        and keep the result.

        '
      properties:
        force:
          type: boolean
          default: false
          description: 'Also replace stored prices nobody has verified. A price a person
            has checked is

            never replaced, with or without this. Without it, a model that already has
            any price

            is left alone: refilling rates an operator may have adjusted is not what
            "import the

            reference prices" should mean by default.

            '
        dry_run:
          type: boolean
          default: false
          description: Report what would happen and keep none of it. The report says
            so as well, because otherwise the counts read identically either way.
        model_ids:
          type: array
          description: 'Consider only these models. Omitted or empty means the whole
            catalogue.


            An id matching no model comes back as a skipped result naming it, rather
            than being

            dropped: a caller''s list goes stale in the ordinary course of things, and
            a run that

            silently considers less than it was asked to leaves the caller believing
            otherwise.

            '
          items:
            type: string
            format: uuid
      additionalProperties: false
    ReferencePriceImportReport:
      type: object
      required:
      - dataset
      - dry_run
      - results
      description: 'What the run did, model by model.


        Every model considered appears exactly once, including the ones no price was
        written for.

        A model quietly missing from this list would recreate the failure the import
        exists to

        remove: a model that refuses traffic with no clue why.

        '
      properties:
        dataset:
          type: string
          description: The dataset the rates were read from, as recorded on every row
            it wrote
        snapshot_date:
          type: string
          description: The day the dataset was taken, as recorded on every row it wrote
        entries:
          type: integer
          description: How many priced models the dataset holds, which is not how many
            of them matched anything here
        dry_run:
          type: boolean
          description: Whether the run kept what it decided. It travels with the report
            because every other field reads identically either way.
        acknowledged:
          type: array
          description: 'The warning codes the run confirmed on the operator''s behalf,
            being the ones the

            interactive editor would have stopped on. Reported rather than left implicit:
            a bulk

            write that silently accepts every warning is worth being able to see. Blockers
            are

            never among them — a blocker means the row would not add up, which is not
            a decision

            anybody gets to sign off.

            '
          items:
            type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/ReferencePriceImportResult'
      additionalProperties: false
    ReferencePriceImportResult:
      type: object
      required:
      - model
      - outcome
      - detail
      properties:
        model:
          type: string
          description: The model's slug, or the id that was asked for when no model
            of that id exists
        outcome:
          type: string
          enum:
          - priced
          - updated
          - unchanged
          - kept
          - verified
          - skipped
          description: '`priced` — had no price and now has the reference rates; `updated`
            — an unverified price differed and was replaced, which only `force` reaches;

            `unchanged` — the stored price already equals the reference; `kept` — already
            priced, and `force` was not asked for; `verified` — a person has checked
            this price, so nothing may replace it;

            `skipped` — no reference rate could be resolved, with the reason in `detail`.


            Under `dry_run` these are what a real run would reach, not what was stored.

            '
        detail:
          type: string
          description: Written to be read by a person — for a skip the reason, for a
            write the dataset entry that supplied the rates and how it matched
      additionalProperties: false
    TokenRatesUSDPerM:
      type: object
      required:
      - input
      - output
      - cache_read
      - cache_write
      properties:
        input:
          $ref: '#/components/schemas/DecimalUSDPerM'
        output:
          $ref: '#/components/schemas/DecimalUSDPerM'
        cache_read:
          $ref: '#/components/schemas/DecimalUSDPerM'
        cache_write:
          $ref: '#/components/schemas/DecimalUSDPerM'
      additionalProperties: false
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: __Host-flb_staff
      description: The administrative session cookie, in its own identity domain
