openapi: 3.1.0
info:
  title: FairLB Console API
  version: 0.1.0
  description: |
    The API an organization's own console reads: usage, request logs, the model
    catalog it may call, and the upstream credentials it brings itself.

    Conventions across every endpoint here: errors are RFC 9457 problem+json,
    lists are cursor-paginated, unsafe writes accept an idempotency header, and
    every response carries X-Request-Id.
servers:
- url: /api/v1
tags:
- name: usage
  description: |
    Usage, request logs and the model catalog. These operations speak in
    tokens, models and providers, which is the gateway's own vocabulary, so
    they are generated and implemented on their own rather than mixed into a
    host application's handlers.
security:
- session: []
paths:
  /orgs/{org_id}/usage:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    get:
      operationId: getUsage
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: Usage over time, optionally grouped
      description: |
        Every member can see operational facts: request counts, tokens, errors
        and latency. A caller without `finance.details.read` gets
        `charged_nano` as 0 and an empty `currency`.

        For such a caller, groups are ordered by `requests DESC, key ASC` — not
        by amount. Ordering by an amount that has been redacted would still
        leak relative spend through the order itself.
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - hour
          - day
          default: day
      - name: group_by
        in: query
        description: |
          The grouping dimension. Omitted, the response carries only the time
          series. Grouping by `api_key` requires `keys.manage`; a caller who
          can read the organization but lacks that capability gets a 403 rather
          than a silently ungrouped answer.
        schema:
          type: string
          enum:
          - model
          - api_key
      - name: api_key_id
        in: query
        description: |
          Restrict to one API key, given as its `key_…` public id. Requires
          `keys.manage`; a caller who can read the organization but lacks that
          capability gets a 403.
        schema:
          type: string
      - name: tz
        in: query
        description: |
          An IANA time zone name such as `Asia/Shanghai`, which decides where a
          day boundary falls when `granularity=day`. Defaults to UTC.

          It matters because buckets are stored on UTC hour boundaries while a
          chart usually labels its axis in the reader's local zone. If the two
          disagree, a daily bar spans two local days and its label can be off by
          a full day.

          Ignored when `granularity=hour`.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageReport'
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/usage.csv:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    get:
      operationId: exportUsageCSV
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: Export usage as CSV, with the same filters as /usage
      description: |
        Requires `finance.details.read`, and `keys.manage` as well when
        `api_key_id` is given. An impersonated session is always refused with
        403, even where it retains the two read capabilities. A caller with no
        relationship to the organization, or a credential reaching past the
        organization it belongs to, gets 404.
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - hour
          - day
          default: day
      - name: api_key_id
        in: query
        description: |
          As on `/usage`: restrict the export to one API key, given as its
          `key_…` public id. The export honours the filter, so filtering to one
          key exports only that key. Requires `keys.manage` in addition to the
          financial read capability.
        schema:
          type: string
      - name: tz
        in: query
        description: As on `/usage`. The export and the chart must agree, or a reader cross-checking them will see two different day boundaries.
        schema:
          type: string
      responses:
        '200':
          description: CSV
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/logs:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    get:
      operationId: listRequestLogs
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: Request log, filterable and cursor-paginated
      description: |
        Every member can see operational facts, but for a caller without the
        financial read capability `charged_nano` is 0 and `api_key_id` is
        omitted entirely.
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: api_key_id
        in: query
        description: |
          An API key's `key_…` public id. Requires `keys.manage`; a caller who
          can read the organization but lacks that capability gets a 403.
        schema:
          type: string
      - name: model
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ok
          - upstream_error
          - client_error
          - canceled
      - name: end_user_id
        in: query
        schema:
          type: string
      - name: cursor
        in: query
        description: |
          The `next_cursor` from the previous page, passed back verbatim. It is
          opaque: internally it is a composite of timestamp and id, because a
          timestamp alone would skip the other rows sharing that instant.
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RequestLog'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Null when there are no more pages
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/logs.csv:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    get:
      operationId: exportLogsCSV
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: Export the request log as CSV, with the same filters
      description: |
        The CSV contains both amounts and key identity, so it requires
        `finance.details.read` and `keys.manage` together. An impersonated
        session is always refused with 403; a caller with no relationship to
        the organization, or one reaching past the organization it belongs to,
        gets 404.
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: api_key_id
        in: query
        description: An API key's `key_…` public id
        schema:
          type: string
      - name: model
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ok
          - upstream_error
          - client_error
          - canceled
      - name: end_user_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/logs/{request_id}:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    - name: request_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getRequestLog
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: One request, including its error and the routes it tried
      description: |
        For a caller without the financial read capability, `charged_nano` is 0
        and both `charged_currency` and `api_key_id` are omitted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogDetail'
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/models:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    get:
      operationId: listAvailableModels
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: The models this organization can call
      description: |
        Every member can see which endpoints and capabilities a model has. A
        caller without the financial read capability gets no `price_*` field
        and no `is_free` either — "this model is free" is itself a statement
        about price.

        Conditional requests are supported: the response carries an `ETag`, and
        sending it back as `If-None-Match` answers 304 when nothing changed.
        The catalog changes on the order of days while several pages each fetch
        it, so this is where the caching belongs.
      parameters:
      - name: If-None-Match
        in: header
        required: false
        description: The ETag from a previous response; unchanged, the answer is 304
        schema:
          type: string
      responses:
        '304':
          description: The catalog has not changed; no body is returned
        '200':
          description: OK
          headers:
            ETag:
              description: A strong validator over the catalog's contents
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableModel'
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/provider-keys:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    get:
      operationId: listOrgProviderKeys
      tags:
      - usage
      summary: List the upstream credentials this organization brought itself
      description: |
        Paginated. The order is by platform then name — this is a configuration
        screen, not a feed, and an organization holding several accounts at the
        same platform reads them together. The cursor follows that same key, so
        paging never rearranges the list to suit itself.

        `vendors` describes the deployment, not the page, so it is repeated on
        every page rather than only on the first: the add-credential form reads
        it, and a form that only works on page one is worse than one that costs
        a few bytes per page.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - vendors
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrgProviderKey'
                  vendors:
                    type: array
                    description: |
                      The platforms a credential can usefully be supplied for here: the vendors this
                      deployment has an enabled provider at. A key for anything else could never take
                      effect, because no candidate would ever be served by it, and it would sit in the
                      list looking configured.

                      It travels with the list rather than at an address of its own so that the page
                      showing the credentials and the form adding one read the same answer.
                    items:
                      $ref: '#/components/schemas/OrgProviderVendor'
                  next_cursor:
                    type: string
                    description: Present when another page follows; pass it back as `cursor`
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createOrgProviderKey
      tags:
      - usage
      summary: Add an upstream credential (it appears only in this request and is encrypted at rest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - vendor
              - name
              - secret
              properties:
                vendor:
                  type: string
                  description: |
                    Which platform this credential is with, from the vendors list on the GET above.
                    A vendor this deployment does not route to is refused: the credential could never
                    apply to anything.
                name:
                  type: string
                  maxLength: 60
                  description: A label, unique within the organization, for telling several credentials apart
                secret:
                  type: string
                  description: The upstream credential itself. It is encrypted before it is stored and no endpoint can read it back.
                base_url:
                  type: string
                  description: A custom upstream endpoint; empty means this deployment's default for that vendor
                allow_fallback:
                  type: boolean
                  default: false
                  description: Whether a request rejected with this credential may fall back to the deployment's own. False by default, deliberately - falling back silently means the request is billed at the full rate rather than the service fee, and a surprising bill is worse than a failed request. Turn it on only when availability matters more.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgProviderKey'
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/provider-keys/{key_id}:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    - name: key_id
      in: path
      required: true
      schema:
        type: string
    delete:
      operationId: deleteOrgProviderKey
      tags:
      - usage
      summary: Delete an upstream credential
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/provider-keys/{key_id}/test:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    - name: key_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: testOrgProviderKey
      tags:
      - usage
      summary: Test a credential by making one minimal upstream request
      description: |
        Sends one real request upstream with this credential to check that it
        works. It costs a small amount of real money, charged to your own
        upstream account, which is why it runs only when asked and never
        automatically.

        A 401 or 403 from upstream marks the credential invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - upstream_model
              properties:
                upstream_model:
                  type: string
                  description: The model name as the upstream knows it
      responses:
        '200':
          description: The test ran; the `ok` field carries the verdict, not the HTTP status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgProviderKeyTestResult'
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/videos:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    get:
      operationId: listVideoJobs
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: Video jobs, filterable and cursor-paginated
      description: |
        The organization's own video jobs, newest first. Every member can see the
        operational facts — what was asked for, what came back, why it failed; for
        a caller without the financial read capability `charged_nano` is 0 and
        `charged_currency` is omitted, the same rule the request log applies.

        Failed jobs are listed, not hidden. A content refusal is the ordinary
        outcome on this plane rather than an edge case, and "why did my video
        fail" has to have an answer somewhere.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - in_progress
          - completed
          - failed
          - canceled
          - expired
      - name: model
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoJob'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Null when there are no more pages
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/videos/{video_id}:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    - name: video_id
      in: path
      required: true
      schema:
        type: string
      description: The job's `vid_` id
    get:
      operationId: getVideoJob
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: One video job
      description: |
        A pure read. It never asks the upstream anything: letting a console page
        drive polling would make an open browser tab an amplifier pointed at the
        vendor. The reconciler is what advances a job.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteVideoJob
      security:
      - session: []
      # Session only. A management key has three scopes and none of them is a
      # write over usage, and inventing a fourth here would widen an externally
      # reachable authentication surface as a side effect of adding a screen.
      # Nothing is out of reach: a person cancels from the console, and a
      # program cancels through the data plane with its ordinary key.
      tags:
      - usage
      summary: Delete a finished job and the video it holds
      description: |
        Deletes what this deployment holds. It does not promise the upstream also
        forgets, and claiming that would be a promise it cannot keep.

        Refused while the job is still running: removing the row would strand the
        reservation until a sweeper reached it hours later, and no usage row would
        ever be written while the upstream carried on generating a clip this
        deployment is billed for. Cancel it first.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - deleted
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/videos/{video_id}/cancel:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    - name: video_id
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: cancelVideoJob
      security:
      - session: []
      # Session only. A management key has three scopes and none of them is a
      # write over usage, and inventing a fourth here would widen an externally
      # reachable authentication surface as a side effect of adding a screen.
      # Nothing is out of reach: a person cancels from the console, and a
      # program cancels through the data plane with its ordinary key.
      tags:
      - usage
      summary: Stop a running job; nothing is charged for it
      description: |
        A cancelled job is never charged. That is a commercial commitment rather
        than a technical consequence, and a commitment nobody can reach is worth
        less than none — which is why this is here and not only on the data plane.

        How far a job can be stopped is a declared per-model capability, not a
        universal verb: the vendors range from a real cancel, through
        cancel-while-queued-only, to none at all. A model that cannot be stopped
        answers `gateway.job_not_cancelable` and says so, rather than reporting a
        success that did nothing. Read `cancel` on the job to know before asking.

        The upstream's own verdict decides. A vendor refusing because generation
        has already begun answers over a perfectly healthy connection, and calling
        the job cancelled anyway would void the hold while the clip is still being
        made and billed to this deployment.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoJob'
        default:
          $ref: '#/components/responses/Problem'
  /orgs/{org_id}/videos/{video_id}/content:
    parameters:
    - $ref: '#/components/parameters/OrgID'
    - name: video_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getVideoJobContent
      security:
      - session: []
      - managementKey:
        - management:usage:read
      tags:
      - usage
      summary: The video itself
      description: |
        The bytes come from this deployment, never as a redirect. An upstream URL
        names the vendor, often carries its credential, and is one this deployment
        can neither renew nor revoke.

        Past its retention window a video is gone, and that is a normal ending
        rather than a fault: it answers 410, which the console shows as "no longer
        kept" instead of an error.
      responses:
        '200':
          description: The video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '410':
          description: The video is past its retention window
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  headers:
    XRequestId:
      description: The request id, present on every response
      schema:
        type: string
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Where to resume from — the previous response's `next_cursor`
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Rows per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OrgID:
      name: org_id
      in: path
      required: true
      description: The organization's public id, prefixed `org_`
      schema:
        type: string
  responses:
    Problem:
      description: Error (RFC 9457)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AvailableModel:
      type: object
      required:
      - slug
      - protocols
      - endpoints
      - output_modalities
      properties:
        slug:
          type: string
        display_name:
          type: string
        output_modalities:
          type: array
          minItems: 1
          description: >-
            What this model produces. Declared on the model rather than derived from `endpoints`:
            the two do not line up, because Gemini serves its image models on the same
            `generate_content` endpoint as its text models. It is what the catalogue's modality
            filter reads.
          items:
            type: string
            enum:
            - text
            - image
            - video
            x-enum-varnames:
            - AvailableModalityText
            - AvailableModalityImage
            - AvailableModalityVideo
        protocols:
          type: array
          items:
            type: string
          description: |
            The protocols the verified endpoints belong to. A model owns no
            protocol of its own: it is reachable on whichever protocols its
            routes' providers speak, and the same slug may be callable on both
            `/v1/chat/completions` and `/v1/messages`.
        endpoints:
          type: array
          items:
            type: string
          description: |
            Which endpoints this model can be called on — chat, messages,
            embeddings and so on — every endpoint a probe has verified on one
            of its enabled routes.

            This is not a capability list. It answers "which URL do I send
            to", not "can this model read an image"; for that, see
            `capabilities`.
        capabilities:
          type: object
          additionalProperties: true
          description: |
            Display metadata such as vision or tool support.

            What can actually be called is always what the model's routes have
            been verified to serve: a capability advertised here with no
            verified route behind it only gets the caller a 404.
        context_window:
          type: integer
        max_output_tokens:
          type: integer
        billing_unit:
          type: string
          enum:
          - token
          - second
          - call
          - image
          description: >-
            What this model is charged by. `token` is the four-bucket family the
            price fields below describe; `second`, `call` and `image` are charged
            from `unit_rates` instead, and the token fields are then absent.


            It exists because "priced by the second" and "not priced" used to be
            indistinguishable here: a per-second model stores explicit zeros in
            the token columns, and a catalogue reading those zeros showed a
            priced model as unpriced. Omitted for a caller without the financial
            read capability, along with everything else about price.
        unit_rates:
          type: array
          description: The rate card for a model not billed by token. Omitted for a
            caller without the financial read capability.
          items:
            $ref: '#/components/schemas/AvailableModelUnitRate'
        price_in_nano_per_mtok:
          type: integer
          format: int64
          description: Omitted for a caller without the financial read capability
        price_out_nano_per_mtok:
          type: integer
          format: int64
          description: Omitted for a caller without the financial read capability
        price_cache_read_nano_per_mtok:
          type: integer
          format: int64
          description: Omitted for a caller without the financial read capability
        price_cache_write_nano_per_mtok:
          type: integer
          format: int64
          description: Omitted for a caller without the financial read capability
        is_free:
          type: boolean
          description: Omitted for a caller without the financial read capability
    AvailableModelUnitRate:
      type: object
      required:
      - unit
      - nano_per_unit
      description: One line of a per-unit rate card, at this organization's own
        multipliers. An empty axis means the rate does not vary on it and applies to
        every value.
      properties:
        unit:
          type: string
          enum:
          - second
          - call
          - image
          x-enum-varnames:
          - AvailableUnitSecond
          - AvailableUnitCall
          - AvailableUnitImage
        resolution:
          type: string
          description: The output size this rate applies to; empty applies to every
