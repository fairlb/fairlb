          format: int64
          description: >-
            Seconds of video billed in this bucket. 0 where nothing here was billed by the second.
        billed_calls:
          type: integer
          format: int64
          description: >-
            Generations billed per call, for upstreams that sell prepaid packs rather than time.
            0 where nothing here was billed that way.


            A column of its own rather than a share of one `billed_units` total: a second of
            video and a generation are different dimensions, and adding them yields a number that
            denotes nothing — the same reason neither is summed into the token counters beside them.
            Named columns rather than a map keyed by unit, because the unit set is closed and
            adding one should be a contract change somebody has to make, not a key that appears.
            `billed_images` is that change having been made.
        billed_images:
          type: integer
          format: int64
          description: >-
            Images billed per produced image. 0 where nothing here was billed that way.
            A column of its own for the same reason billed_calls is: a request for four
            images is four units here and one there, so the two cannot share a total.
        charged_nano:
          type: integer
          format: int64
          description: 0 for a caller without the financial read capability
        errors:
