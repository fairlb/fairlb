    VideoJob:
      type: object
      required:
      - id
      - model
      - status
      - created_at
      - expires_at
      - deletable
      description: >-
        One video job as its owner sees it. The upstream's own job id and the
        upstream download URL are absent by design and not by omission: upstream
        anonymity is a property of this gateway, and that URL is one it can
        neither renew nor revoke.


        So is `settlement_state`. What the money did is a separate column from
        what the caller sees, deliberately — the two really do come apart — but it
        is bookkeeping for whoever runs the deployment, not an answer this
        organization asked for. `charged_nano` is.
      properties:
        id:
          type: string
          description: The job's id, prefixed `vid_`
        model:
          type: string
          description: The catalog slug as it was at submission, snapshotted — the row
            stays readable after the model is renamed or removed
        status:
          type: string
          enum:
          - queued
          - in_progress
          - completed
          - failed
          - canceled
          - expired
        progress:
          type: integer
          minimum: 0
          maximum: 100
        prompt:
          type: string
          description: What was asked for
        negative_prompt:
          type: string
        duration_seconds:
          type: integer
        resolution:
          type: string
        aspect_ratio:
          type: string
        audio:
          type: boolean
        n:
          type: integer
        cancel:
          type: string
          enum:
          - never
          - queued_only
          - anytime
          description: >-
            How far this job can still be stopped, carried on the row so that the
            interface can decide whether to offer a stop button rather than
            offering one that fails. It is the model's declared capability, not a
            promise about this instant — a `queued_only` job that has started
            generating still refuses.
        deletable:
          type: boolean
          description: >-
            Whether this job can be deleted right now, carried for the same
            reason `cancel` is: so the interface can offer the control only where
            it works. False while the job is still running, and false while it is
            still holding a reservation — a job whose charge has not been settled
            or voided is the only row that points at that hold, and deleting it
            would strand the money.


            It is a capability rather than the settlement state itself. That is
            not a redaction: on a terminal job a false here does mean the charge
            is still held or protected, so this much of the settlement state is
            derivable by anyone who can list jobs. What the contract withholds is
            the amount, which `charged_nano` gates on the financial read
            capability.
        billed_units:
          type: integer
          format: int64
          description: How many units this job was charged for — seconds of output, or
            generations
        billed_unit:
          type: string
          enum:
          - ''
          - second
          - call
          description: Which unit `billed_units` counts. Empty before the job reaches
            a terminal state.
        charged_nano:
          type: integer
          format: int64
          description: >-
            0 for a caller without the financial read capability, and 0 for a job
            that produced nothing: a failed or cancelled job is never charged, and
            its row is kept rather than hidden so that the zero is visible.
        charged_currency:
          type: string
          description: Omitted for a caller without the financial read capability
        error:
          type: object
          description: Present on a failed job. The upstream's own words are kept
            verbatim — a content refusal rendered as a bare code is a support ticket.
          required:
          - code
          properties:
            code:
              type: string
            message:
              type: string
        artifact:
          type: object
          description: What is holdable of the result. Absent until the job completes,
            and its `available` goes false once the retention window has passed.
          required:
          - available
          properties:
            available:
              type: boolean
            bytes:
              type: integer
              format: int64
            content_type:
              type: string
        created_at:
          type: string
          format: date-time
        submitted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the upstream accepted it. Null while the hold exists but
            nothing has been sent.
        terminal_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When this row and its video are removed. It is a retention
            setting of the deployment, not a property of the vendor's link.
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-flb_session
      description: The console session cookie
    managementKey:
      type: http
      scheme: bearer
      description: |
        A management key, sent as `Authorization: Bearer <key>`. Its scopes must
        include `management:keys:rw` to manage keys, or
        `management:usage:read` to read usage and logs.

        Management keys reach only the key and usage endpoints, and that is an
        allowlist: an endpoint that does not declare this scheme refuses them.
        A newly added endpoint is therefore never silently reachable because
        somebody forgot to annotate it.

        A management key acts only on the organization it belongs to. A
        different organization in the URL answers 404, following the same rule
        that hides the existence of resources a caller has no relationship
        with.
