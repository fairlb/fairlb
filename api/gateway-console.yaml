          - AvailableAudioAny
          - AvailableAudioOn
          - AvailableAudioOff
          description: Video only; an image rate leaves it empty
        variant:
          type: string
          description: >-
            A subdivision within the unit, such as the quality tier an image model sells.
            Empty applies to every variant. Without it a model priced at two quality tiers
            renders two identical-looking lines carrying different numbers.
        nano_per_unit:
          type: integer
          format: int64
